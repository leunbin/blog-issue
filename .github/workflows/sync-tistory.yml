name: Sync Tistory Posts

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tistory-rss-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Match Tistory posts and close issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TISTORY_RSS_URL: https://eunkongee.tistory.com/rss
        run: python scripts/sync_tistory.py

      - name: Commit updated study log
        run: |
          if git diff --quiet -- README.md data/published-posts.json; then
            echo "No study log changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/published-posts.json
          git commit -m "docs: sync published Tistory posts"
          git push
